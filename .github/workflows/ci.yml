name: CI

on:
  pull_request:
  push:
    branches:
      - main

# One run per ref: pushing again cancels the superseded run instead of queueing a second full suite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The test suite spawns a server on a local port and writes the built bundle, nothing more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes, so the job token does not need to sit in .git/config during npm ci.
          persist-credentials: false

      # v7 runs on node24 (the v4 tags this replaced ran their own runtime on node20, which GitHub is retiring).
      # The project's Node version still comes from .nvmrc, which test/node-version.test.js pins against engines.
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          # Explicit, so caching stays on for this project even if a packageManager field is added later
          # and so it is never enabled implicitly by a future default.
          package-manager-cache: true

      - run: npm ci

      # test/run.js spawns `node --test --test-concurrency=1` over every test/*.test.js file.
      # build-client --check and make-typeface --check already run inside test/client3d.test.js.
      - run: npm test

      # Required real-browser CSP/WebGL coverage; npm test stays browser-free.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
