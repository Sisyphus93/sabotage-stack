# Weekly Dependabot version updates for npm dependencies and GitHub Actions.
#
# Keep exact npm versions and Action commit SHAs current rather than letting them rot.
#
# Every Dependabot pull request runs the full suite, because ci.yml triggers on pull_request and the job
# only needs `contents: read` — no secrets, so Dependabot's restricted token is enough.
#
# Dependabot only reads this file from the default branch, so nothing happens until this is merged to main.
version: 2

updates:
  - package-ecosystem: 'github-actions'
    # For GitHub Actions, '/' means: scan .github/workflows (and an action.yml at the root, if one exists).
    directory: '/'
    schedule:
      interval: 'weekly'
      # Monday, early morning UTC, ahead of the working week rather than in the middle of it.
      day: 'monday'
      time: '05:00'
      timezone: 'UTC'
    # One action per pull request (there are two today). If a bump breaks the build, the failure points at one
    # action instead of a bundle, and the other still lands on its own.
    open-pull-requests-limit: 5
    # Tests decide whether a bump is good; the label is only for finding these later.
    labels:
      - 'dependencies'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    groups:
      # Keep runtime dependencies and major updates separate so failures are easier to isolate.
      development-minor-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'
